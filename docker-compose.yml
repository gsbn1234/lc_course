# 第 7 步：Docker 一键部署。三个服务：
#   redis    —— 会话元数据（独立容器，backend 通过 REDIS_HOST=redis 连）
#   backend  —— FastAPI(8000)：Agent-RAG 核心
#   frontend —— Streamlit(8501)：网页，BACKEND_URL=http://backend:8000 调后端
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data            # Redis 数据持久化
    healthcheck:                    # 后端等它健康了才启动，避免连不上
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env                  # secrets 运行期注入，不打进镜像
    environment:
      - REDIS_HOST=redis            # 覆盖 session_store.py 默认的 localhost
      - HF_HOME=/hf_cache           # 模型缓存指向挂载的 D 盘
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_HUB_OFFLINE=1            # 模型全走本地缓存，禁联网检查（容器内 HF 被墙 + hub client 已关会报错）
    volumes:
      - ./faiss_db:/app/faiss_db                     # 会话索引持久化（上传建好的库）
      - ./checkpoints.sqlite:/app/checkpoints.sqlite  # 对话记忆（SqliteSaver）
      - /mnt/d/AI_CACHE/huggingface:/hf_cache         # 复用 D 盘已下载的模型，不重复下载
    ports:
      - "8000:8000"
    healthcheck:
      # /api/health 会真去 ping Redis、看索引目录、读 MCP 状态；
      # Redis 挂了它返 503，这里就跟着 unhealthy，编排系统能把流量摘走。
      # 为什么用 python 而不是 curl：backend 镜像里没装 curl，python 一定有。
      # urlopen 遇到非 2xx 会抛异常，所以"没抛"就等于 200，不用再判一次状态码。
      test: ["CMD", "python", "-c", "import sys,urllib.request\ntry: urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)\nexcept Exception: sys.exit(1)\nsys.exit(0)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s               # 启动要加载模型，别没起来就判死
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000   # compose 服务名在容器网络里就是域名
      # 后端开了鉴权时，前端得拿同一个 Key 才能调通。
      # 后端那边的同名变量由 env_file: .env 注入，这里单独给前端补一份。
      # ${VAR:-} 的默认空值：没配就传空串，前后端行为一致（都不校验收发）。
      - BACKEND_API_KEY=${BACKEND_API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  redis_data:
